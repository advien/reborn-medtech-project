[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reborn"
version = "0.1.0"
description = "Safety-first, human-in-the-loop active elbow orthosis — research platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]
ml = [
    "scikit-learn>=1.3",
    "torch>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["reborn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
